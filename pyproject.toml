[project]
name = "skore-skills"
description = "Deterministic CLI helpers for Probabl ML agent skills."
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
authors = [{ name = "Probabl", email = "contact@probabl.ai" }]
dependencies = [
    "click",
]

[project.scripts]
skore-skills = "skore_skills.cli:main"

[project.urls]
Homepage = "https://probabl.ai"
Repository = "https://github.com/probabl-ai/skore-skills"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata.hooks.custom]
path = "hatch/metadata.py"
version-default = "0.0.0+unknown"

[tool.hatch.build.targets.wheel]
packages = ["src/skore_skills"]

[tool.hatch.build.targets.wheel.force-include]
".catalog.json" = "skore_skills/data/catalog.json"

[tool.hatch.build.targets.sdist]
include = ["src/skore_skills", ".catalog.json", "hatch"]

[tool.pytest.ini_options]
testpaths = ["tests/skore_skills"]
pythonpath = ["."]
markers = [
    "eval: LLM-backed skill evaluations (opt-in; requires provider API keys)",
]
addopts = [
    "-ra",
    "--strict-markers",
    "--import-mode=importlib",
]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["skore_skills"]
parallel = true

[tool.coverage.report]
omit = ["tests/*", "*/skore_skills/templates/*"]
show_missing = true
exclude_also = [
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
exclude = ["src/skore_skills/templates"]

[tool.ruff.lint]
select = [
    "B",
    "C4",
    "T10",
    "T20",
    "PT003",
    "PT014",
    "SIM",
    "I",
    "PERF",
    "E",
    "D",
    "F",
    "UP",
]
ignore = ["PERF203"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"tests/skore_skills/fixtures/**" = ["T201", "B018"]

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true
exclude = ["tests/", "templates/"]
warn_unused_configs = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
ignore_missing_imports = true
module = [
    "click",
    "click.*",
    "matplotlib",
    "pandas",
    "IPython.*",
    "jupytext",
    "nbclient",
    "nbformat",
    "nbconvert",
    "ipywidgets",
    "skore",
    "skore.*",
]
