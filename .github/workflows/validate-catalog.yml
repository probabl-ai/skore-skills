name: Validate catalog

on:
  pull_request:
    paths:
      - ".catalog.json"
      - "skills/**"
      - "eval/**"
      - "tools/**"
      - ".claude-plugin/**"
      - ".cursor-plugin/**"
      - "pixi.toml"
      - "pixi.lock"
      - ".github/workflows/validate-catalog.yml"
  push:
    branches: [main]
    paths:
      - ".catalog.json"
      - "skills/**"
      - "eval/**"
      - "tools/**"
      - ".claude-plugin/**"
      - ".cursor-plugin/**"
      - "pixi.toml"
      - "pixi.lock"
      - ".github/workflows/validate-catalog.yml"

jobs:
  validate:
    name: Catalog hashes + structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          locked: true
          cache: true
          # Only write the cache from pushes to main, to keep the
          # repository's cache footprint below GitHub's 10 GB cap.
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}

      - name: Run all catalog checks
        run: pixi run check
